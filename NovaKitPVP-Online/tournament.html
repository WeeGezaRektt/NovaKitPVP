<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100912">
  <title>NovaKitPVP — Tournament</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/tournament.css">
</head>
<body>
  <div class="ambient a1"></div><div class="ambient a2"></div>

  <header class="topbar tournament-topbar">
    <a class="brand" href="/">
      <span class="brand-mark" id="brandMark">N</span>
      <span>NovaKitPVP<small>Tournament Brackets</small></span>
    </a>
    <div class="nav-actions tournament-nav-actions">
      <a class="btn tournament-home-btn" href="/">Rankings</a>
      <a class="btn" href="/admin">Staff Login</a>
    </div>
  </header>

  <main class="tournament-shell">
    <section class="tournament-hero">
      <div>
        <div class="eyebrow">NOVA TOURNAMENT</div>
        <h1>Kit Tournament Brackets</h1>
        <p>Follow every kit bracket live. Only NovaKitPVP Owners can edit seeds, remove players, move players, or advance winners.</p>
      </div>
      <div id="accessBadge" class="tournament-access-badge">Loading…</div>
    </section>

    <nav id="tournamentKitNav" class="tournament-kit-nav" aria-label="Tournament kits"></nav>

    <section id="ownerControls" class="tournament-owner-panel card hidden"></section>

    <section class="tournament-board-card card">
      <div class="tournament-board-head">
        <div>
          <div class="eyebrow" id="bracketEyebrow">BRACKET</div>
          <h2 id="bracketTitle">Loading…</h2>
        </div>
        <div id="bracketMeta" class="tournament-meta"></div>
      </div>
      <div id="bracketViewport" class="tournament-bracket-viewport">
        <div class="spinner"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/tournament.js"></script>
  <script src="/v12-public.js" defer></script>
</body>
</html>
